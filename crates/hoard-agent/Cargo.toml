[package]
name = "hoard-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared client logic for the Hoard CLI and desktop app"

[lib]
name = "hoard_agent"
path = "src/lib.rs"

[dependencies]
hoard-core = { path = "../hoard-core" }
hoard-manifest = { path = "../hoard-manifest" }

tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
directories = { workspace = true }
async-compression = { workspace = true }
tokio-tar = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
sysinfo = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
# Restoring the original mtime onto extracted files. The tar header carries
# each file's source mtime; without re-applying it the freshly-written file
# gets mtime=now and would always beat the local copy in the conflict-aware
# diff (`agent::local_mtime_wins`), so cloud pulls looked "newer" forever.
filetime = "0.2"

# Lectura del ÍNDICE de comprimidos (sin descomprimir) para puntuar saves
# que viven dentro de un .zip (Factorio y varios indies). `default-features
# = false`: sólo leemos el directorio central (nombres de entrada), nunca
# inflamos contenido, así que no hace falta arrastrar codecs (deflate, zstd,
# bzip2...). Único consumidor: `scoring::archive_looks_like_save`, así que
# se queda fuera de `[workspace.dependencies]`.
zip = { version = "2", default-features = false }

# OS-native credential storage. Linux uses libsecret via sync-secret-service
# (no async runtime in the way), Windows uses Credential Manager, macOS uses
# the Keychain. When none of these are available the desktop client falls
# back to a 0600 file — see `credentials.rs`.
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

# Verificador minisign (Ed25519). Un instalador bajado de internet se ejecuta
# con privilegios, así que no se aplica ninguno sin firma válida de CI (ADR
# 0017). Estaba sólo en el desktop; baja aquí porque desde la unificación la
# terminal instala la app igual que la app se actualiza a sí misma, y la
# comprobación tiene que ser la misma en los dos caminos.
minisign-verify = "0.2"

# Windows-only registry access for `pathexpand` (OneDrive-aware Known Folder
# lookups via User Shell Folders) and `steam` (Steam's install path from
# `Valve\Steam\SteamPath`, so non-default install drives are found). Kept
# under `cfg(windows)` so non-Windows builds don't pull it in.
#
# `rusqlite` powers the GOG Galaxy enumerator in `launchers.rs`: Galaxy
# stores its installed-product index in `galaxy-2.0.db`, a sqlite file
# under `%LOCALAPPDATA%`. Feature `bundled` compiles sqlite into the
# binary so Windows hosts without a system sqlite still work (sqlite is
# not part of the standard Windows install). Single consumer + cfg-gated,
# so it also stays out of `[workspace.dependencies]`.

# `geteuid` en `install/`: parte de decidir si podemos elevar privilegios sin
# quedarnos esperando a un humano que dentro de `curl … | sh` no existe. Ya está
# en el árbol de dependencias (tokio lo arrastra en unix), así que no añade
# compilación; único consumidor y cfg-gated, de ahí que no vaya al workspace.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# `SendMessageTimeoutW` para difundir `WM_SETTINGCHANGE` tras tocar el PATH del
# usuario en `install::ensure_cli_reachable`. Sin esa difusión el cambio queda
# escrito pero invisible: Explorer conserva su bloque de entorno en caché y toda
# terminal que lance hereda el viejo, así que `hoard` no existiría hasta cerrar
# sesión. Comprobado contra la máquina Windows del usuario.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # `GetLogicalDrives` + `GetDriveTypeW` en `roots::internal_drive_roots`: un
    # emulador descomprimido en D: no deja rastro en %APPDATA%, así que hay que
    # preguntarle al SO qué unidades fijas hay antes de buscarlo.
    "Win32_Storage_FileSystem",
    # `DRIVE_FIXED`, que vive en otro módulo que las dos funciones que lo usan.
    "Win32_System_WindowsProgramming",
] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = { workspace = true }
# Mirror of the cfg(windows) prod dep: GOG Galaxy's sqlite reader lives in
# `launchers.rs`, but its parser code is OS-agnostic and gets exercised by
# tests on Linux too (synthesised fixture). The dev-dep makes the
# `gog_read_db` helper compile cross-platform so the tests can run.
[target.'cfg(not(windows))'.dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
