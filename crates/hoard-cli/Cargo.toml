[package]
name = "hoard-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hoard"
path = "src/main.rs"

[dependencies]
hoard-agent = { path = "../hoard-agent" }

tokio = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
indicatif = { workspace = true }
# `hoard saves` formatea las fechas de último backup (OffsetDateTime → RFC3339).
time = { workspace = true }
# `hoard track` en Cloud acuña un save_id local (Cloud no tiene create_save
# server-side; la fila se materializa en el primer upload por UPSERT). Mismo
# patrón que `add_game_to_tracking` de la desktop.
uuid = { workspace = true }
# `hoard login` (Cloud) lee la contraseña sin echo en la terminal.
rpassword = { workspace = true }
