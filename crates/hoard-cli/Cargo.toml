[package]
name = "hoard-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hoard"
path = "src/main.rs"

[dependencies]
hoard-agent = { path = "../hoard-agent" }

tokio = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
indicatif = { workspace = true }
# `hoard saves` formatea las fechas de último backup (OffsetDateTime → RFC3339).
time = { workspace = true }
# `hoard login` (Cloud) lee la contraseña sin echo en la terminal.
rpassword = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
