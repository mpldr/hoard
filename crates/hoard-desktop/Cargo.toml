[package]
name = "hoard-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Hoard desktop app — auto-backups for game saves"

[[bin]]
name = "hoard-desktop"
path = "src/main.rs"

[lib]
name = "hoard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[features]
# Enables Tauri's custom-protocol asset loader so production builds serve the
# bundled frontend from `tauri://localhost` instead of falling back to the
# Vite dev URL. Default-on so plain `cargo build --release` produces a
# working app; `cargo tauri dev` / `--no-default-features` opt out for HMR.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hoard-agent = { path = "../hoard-agent" }
hoard-manifest = { path = "../hoard-manifest" }
# El desktop es un cliente del servicio local desde el Slice 4b (ADR 0021):
# `hoardd` trae el cliente IPC + "spawn if absent", y `hoard-core` los tipos que
# viajan por el socket. Ninguno arrastra el motor: el motor vive en el servicio.
hoard-core = { path = "../hoard-core" }
hoardd = { path = "../hoardd" }
base64 = { workspace = true }

tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
# Deep link — registers the `hoard://` scheme so the OAuth callback from
# Hoard Cloud can hand the desktop app a Supabase access_token.
tauri-plugin-deep-link = "2"
# Global hotkey support (fires regardless of focus). Generic capability; the
# binding (Ctrl+O for the Pro overlay) is registered at runtime by the UI only
# when the Pro layer is present — the community build ships the plugin unused.
tauri-plugin-global-shortcut = "2"
# Sin `keyring`: desde D.20 (ADR 0021) el desktop no toca el almacén de secretos.
# El par de tokens Cloud lo escribe y lo lee el servicio, que es su dueño — en
# macOS el ítem sólo autoriza al binario que lo creó, así que compartirlo entre dos
# binarios era un diálogo de contraseña por lectura. No volver a añadirla aquí: si
# un comando necesita el token, se lo pide al servicio (`DaemonLink::cloud_token`).
toml = { workspace = true }
# Ed25519 minisign verifier — gates the auto-updater so an installer is only
# run (as root, via pkexec) after its signature matches the embedded release
# key. Same crate/key the server's `hoard-server upgrade` uses. See ADR 0017.

reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
time = { workspace = true, features = ["local-offset"] }
uuid = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `start_paused` for the cloud-pull throttle tests: the fallback feed refresh
# only unblocks after a minute of wall clock, and a suite that actually waits
# out a minute is a suite nobody runs. Dev-only under resolver 2, so no
# production build picks it up.
tokio = { workspace = true, features = ["test-util"] }
