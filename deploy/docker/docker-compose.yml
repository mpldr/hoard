# Hoard server — single-node deployment.
#
# Usage:
#   cd deploy/docker
#   docker compose up -d            # start
#   docker compose logs -f          # follow logs
#   docker compose exec server hoard-admin user create alice --password 'SECRET'
#   docker compose down             # stop (volumes preserved)
#
# Mount your own config.toml under ./config/ to avoid the auto-bootstrap.

services:
  server:
    # Prebuilt multi-arch image (amd64/arm64) published to GHCR on every
    # release tag — `docker compose pull && docker compose up -d` to update.
    # Pin a version (…/hoard:1.0) instead of :latest for reproducible upgrades.
    image: ghcr.io/rleeon/hoard:latest
    # To build from source instead of pulling, uncomment `build:` below (it
    # overrides the pull) — the context is the repo root so the workspace
    # resolves.
    # build:
    #   context: ../..
    #   dockerfile: deploy/docker/Dockerfile
    container_name: hoard-server
    restart: unless-stopped
    ports:
      - "${HOARD_PORT:-12421}:12421"
    environment:
      # Override TOML keys without rebuilding/remounting:
      # HOARD__SERVER__PORT must stay 12421 inside the container — change the
      # host-side mapping above instead.
      HOARD__LOGGING__LEVEL: ${HOARD_LOG_LEVEL:-info}
      HOARD__LOGGING__FORMAT: ${HOARD_LOG_FORMAT:-json}
    volumes:
      # Persistent data (SQLite DB, snapshots, tmp, trash).
      - hoard-data:/var/lib/hoard
      # Drop your own config.toml here; the entrypoint will use it.
      - ./config:/etc/hoard:ro
    healthcheck:
      # Compose-side healthcheck (the Dockerfile one is intentionally shallow).
      # Uses wget which we install via a tiny addition below; if you'd rather
      # not, comment this out and rely on Docker's TCP-restart fallback.
      test: ["CMD-SHELL", "wget -qO- http://localhost:12421/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  hoard-data:
    name: hoard-data
